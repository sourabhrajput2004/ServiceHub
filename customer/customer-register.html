<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register as Customer - ServiceHub</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            Service<span>Hub</span>
        </div>

        <nav class="nav-links">
            <a href="../index.html">Home</a>
            <a href="../index.html#services">Services</a>
            <a href="../index.html#about">About</a>
        </nav>

        <!-- <div class="nav-buttons">
            <a href="../login.html" class="login-btn">
                Login
            </a>
        </div> -->

    </header>


    <!-- ================= REGISTER FORM ================= -->

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <p class="section-tag">
                    CUSTOMER ACCOUNT
                </p>

                <h1>
                    Create Your Account
                </h1>

                <p>
                    Register with ServiceHub to find repair services
                    and manage your repair requests.
                </p>

            </div>


            <form class="auth-form">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Mobile -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter your mobile number"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- Terms -->

                <div class="terms-group">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the ServiceHub
                        Terms & Conditions and Privacy Policy.
                    </label>

                </div>


                <!-- Register -->

                <button
                    type="submit"
                    class="primary-btn auth-button"
                >
                    Create Customer Account
                </button>

            </form>


            <!-- Login -->

            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="../login.html">
                        Login here
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="logo">
            Service<span>Hub</span>
        </div>

        <p>
            © 2026 ServiceHub. All rights reserved.
        </p>

    </footer>

</body>
</html>
