<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ServiceHub</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="logo">
            <a href="index.html">ServiceHub</a>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#services">Services</a>
            <a href="index.html#about">About</a>
        </div>

    </nav>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-container">

            <div class="auth-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to your ServiceHub account
                </p>

            </div>


            <form class="auth-form">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Forgot Password -->
                <div class="forgot-password">

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>


            <!-- Registration -->
            <div class="auth-footer">

                <p>
                    Don't have an account?
                </p>

                <div class="auth-register-links">

                    <a href="customer/customer-register.html">
                        Register as Customer
                    </a>

                    <span> | </span>

                    <a href="shop-owner/shop-register.html">
                        Register Your Shop
                    </a>

                </div>

            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 ServiceHub. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
