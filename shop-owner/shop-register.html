<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Your Shop - ServiceHub</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            Service<span>Hub</span>
        </div>


        <nav class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="../index.html#services">
                Services
            </a>

            <a href="../index.html#about">
                About
            </a>

        </nav>


        <div class="nav-buttons">

            <a href="../login.html" class="login-btn">
                Login
            </a>

        </div>

    </header>



    <!-- ================= SHOP REGISTRATION ================= -->

    <main class="auth-page">

        <div class="auth-container">


            <div class="auth-header">

                <p class="section-tag">
                    BUSINESS REGISTRATION
                </p>

                <h1>
                    Register Your Shop
                </h1>

                <p>
                    Create your shop account and start managing
                    your repair business with ServiceHub.
                </p>

            </div>



            <!-- SHOP REGISTRATION FORM -->

            <form class="auth-form">


                <!-- OWNER NAME -->

                <div class="form-group">

                    <label for="ownerName">
                        Owner Full Name
                    </label>

                    <input
                        type="text"
                        id="ownerName"
                        name="ownerName"
                        placeholder="Enter owner's full name"
                        required
                    >

                </div>



                <!-- SHOP NAME -->

                <div class="form-group">

                    <label for="shopName">
                        Shop Name
                    </label>

                    <input
                        type="text"
                        id="shopName"
                        name="shopName"
                        placeholder="Enter your shop name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Business Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter business email"
                        required
                    >

                </div>



                <!-- MOBILE -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        placeholder="Enter business mobile number"
                        required
                    >

                </div>



                <!-- SHOP CATEGORY -->

                <div class="form-group">

                    <label for="category">
                        Shop Category
                    </label>

                    <select
                        id="category"
                        name="category"
                        required
                    >

                        <option value="">
                            Select shop category
                        </option>

                        <option value="mobile">
                            Mobile Repair
                        </option>

                        <option value="laptop">
                            Laptop / Computer Repair
                        </option>

                        <option value="tv">
                            TV Repair
                        </option>

                        <option value="appliance">
                            Home Appliance Repair
                        </option>

                        <option value="electronics">
                            Electronics Repair
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- SHOP ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Shop Address
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="4"
                        placeholder="Enter complete shop address"
                        required
                    ></textarea>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Create Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>



                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>



                <!-- TERMS -->

                <div class="terms-group">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">

                        I agree to the ServiceHub
                        Terms & Conditions and Privacy Policy.

                    </label>

                </div>



                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="primary-btn auth-button"
                >
                    Register Shop
                </button>


            </form>



            <!-- LOGIN LINK -->

            <div class="auth-footer">

                <p>

                    Already registered?

                    <a href="../login.html">
                        Login
                    </a>

                </p>

            </div>


        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="logo">
            Service<span>Hub</span>
        </div>

        <p>
            © 2026 ServiceHub. All rights reserved.
        </p>

    </footer>


</body>

</html>
